name: Release

# Runs only when a v* tag lands: one linux build, attached to the GitHub
# release with its checksum. Everyday pushes cost nothing.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Build the server binary
        run: cargo build --release --locked -p alias-cache-cli
      - name: Package with checksum
        run: |
          cp target/release/alias-cache-cli alias-cache-linux-x64
          sha256sum alias-cache-linux-x64 > alias-cache-linux-x64.sha256
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            alias-cache-linux-x64 alias-cache-linux-x64.sha256
