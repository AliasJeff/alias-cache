[workspace]
members = [
    "alias-cache",
    "alias-cache-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
bytes = { version = "1.10", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "std", "help", "usage", "error-context", "env"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
openraft = { version = "=0.10.0-alpha.34", features = ["type-alias", "serde"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rustls = "0.23"
rustls-pemfile = "2.2"
tokio-rustls = "0.26"
