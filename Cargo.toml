[workspace]
members = [
    "alias-cache",
    "alias-cache-cli",
    "benchmark",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
version = "0.2.0"

[workspace.dependencies]
bytes = { version = "1.10", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "std", "help", "usage", "error-context", "env"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
bincode2 = "2.0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
openraft = { version = "=0.10.0-alpha.34", features = ["type-alias", "serde"] }
raft-engine = { git = "https://github.com/tikv/raft-engine", rev = "097c499a19fbb38754c73aa2f31532329df7c0c6", default-features = false }
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
mlua = { version = "0.11", features = ["lua51", "vendored", "send"], default-features = true }
mimalloc = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rustls = "0.23"
rustls-pemfile = "2.2"
tempfile = "3"
tokio-rustls = "0.26"
