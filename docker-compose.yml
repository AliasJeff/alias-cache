# Three-node strongly consistent cluster. Node 1 seeds membership on first
# start; nodes 2 and 3 join as voters immediately. Kill any container and the
# surviving two elect a new leader without losing committed writes.
services:
  node-1:
    build: .
    command: >-
      --node-id 1
      --client-addr 172.30.255.11:6379
      --raft-addr 172.30.255.11:16379
      --data-dir /data
      --bootstrap
      --peer 1=172.30.255.11:16379/172.30.255.11:6379
      --peer 2=172.30.255.12:16379/172.30.255.12:6379
      --peer 3=172.30.255.13:16379/172.30.255.13:6379
    volumes:
      - node-1-data:/data
    ports:
      - "6379:6379"
    networks:
      default:
        ipv4_address: 172.30.255.11
  node-2:
    build: .
    command: >-
      --node-id 2
      --client-addr 172.30.255.12:6379
      --raft-addr 172.30.255.12:16379
      --data-dir /data
      --peer 1=172.30.255.11:16379/172.30.255.11:6379
      --peer 2=172.30.255.12:16379/172.30.255.12:6379
      --peer 3=172.30.255.13:16379/172.30.255.13:6379
    volumes:
      - node-2-data:/data
    ports:
      - "6380:6379"
    networks:
      default:
        ipv4_address: 172.30.255.12
  node-3:
    build: .
    command: >-
      --node-id 3
      --client-addr 172.30.255.13:6379
      --raft-addr 172.30.255.13:16379
      --data-dir /data
      --peer 1=172.30.255.11:16379/172.30.255.11:6379
      --peer 2=172.30.255.12:16379/172.30.255.12:6379
      --peer 3=172.30.255.13:16379/172.30.255.13:6379
    volumes:
      - node-3-data:/data
    ports:
      - "6381:6379"
    networks:
      default:
        ipv4_address: 172.30.255.13

volumes:
  node-1-data:
  node-2-data:
  node-3-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.255.0/24
